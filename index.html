<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ihsan's Playlist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
</head>
<body>

<div class="aurora-bg">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
</div>

<div id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="url(#lg)" stroke-width="1.5"/><path d="M8 12.5a4 4 0 0 0 8 0" stroke="url(#lg)" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="9.5" r="1" fill="url(#lg)"/><circle cx="15" cy="9.5" r="1" fill="url(#lg)"/><defs><linearGradient id="lg" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs></svg>
                <span>ihsan<em>.fm</em></span>
            </div>
            <nav class="nav-links">
                <div class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    Home
                </div>
                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    Search
                </div>
                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    Library
                </div>
            </nav>
        </div>

        <div class="viewer-card">
            <div class="viewer-label">(Model by Nick Slough · poly.pizza)</div>
            <div id="viewer-container"></div>
            <div class="viewer-eq" id="eqBars">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <div class="sidebar-stats">
            <div class="stat"><span id="statCount">19</span><small>tracks</small></div>
            <div class="stat"><span>∞</span><small>vibes</small></div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
        <div class="hero">
            <div class="hero-gradient" id="heroGradient"></div>
            <div class="hero-inner">
                <div class="cover-wrap">
                    <img src="cover.png" alt="Cover" class="playlist-img-file" id="coverImg">
                    <div class="cover-glow" id="coverGlow"></div>
                </div>
                <div class="playlist-text">
                    <span class="playlist-type">✦ Public Playlist</span>
                    <h1 class="playlist-title">mi música<br><em>favorita</em></h1>
                    <p class="playlist-stats">
                        <span class="dot-green"></span>
                        Ihsan &nbsp;·&nbsp; 19 songs
                    </p>
                </div>
            </div>
        </div>

        <div class="content-body">
            <div class="action-bar">
                <button class="play-main-btn" id="playMainBtn">
                    <svg id="playMainIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="shuffle-main-btn" id="shuffleBtn" title="Shuffle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="repeat-btn" id="repeatBtn" title="Repeat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
                <div class="track-count-badge" id="nowPlayingBadge">
                    <span class="badge-icon" id="badgeIcon">🎵</span>
                    <span id="badgeText">Select a track</span>
                </div>
            </div>

            <table class="song-table">
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th>Title</th>
                        <th class="col-album">Album</th>
                        <th class="col-dur">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </th>
                    </tr>
                </thead>
                <tbody id="songTable"></tbody>
            </table>
        </div>
    </main>

    <!-- PLAYER BAR -->
    <footer class="player" id="playerBar">
        <div class="current-track">
            <div class="track-emoji" id="trackEmoji">🎵</div>
            <div class="track-info">
                <div class="track-title" id="trackTitle">Select a track</div>
                <div class="track-artist" id="trackArtist">Unknown Artist</div>
            </div>
            <button class="like-btn" id="likeBtn" title="Like">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn" title="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button id="playBtn" class="play-circle">
                    <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="nextBtn" title="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <a id="downloadBtn" href="" download="" title="Download">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </a>
            </div>
            <div class="playback-bar">
                <span id="currentTime">0:00</span>
                <div class="progress-track">
                    <input type="range" id="progressBar" value="0">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-extra">
            <div class="volume-control">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <div class="vol-track">
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                    <div class="vol-fill" id="volFill"></div>
                </div>
            </div>
        </div>
    </footer>
</div>

<audio id="audio"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="script.js"></script>
</body>
</html>
